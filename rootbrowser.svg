<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Root Browser</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22ff88"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22ff88"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0c1626"/>
      <stop offset="1" stop-color="#060b14"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="2"/>

  <!-- globe grid -->
  <g stroke="#22d3ee" stroke-opacity="0.22" stroke-width="3" fill="none">
    <ellipse cx="256" cy="256" rx="70" ry="168"/>
    <ellipse cx="256" cy="256" rx="125" ry="168"/>
    <line x1="256" y1="88" x2="256" y2="424"/>
    <line x1="88" y1="256" x2="424" y2="256"/>
    <path d="M110 170 Q256 205 402 170"/>
    <path d="M110 342 Q256 307 402 342"/>
  </g>

  <!-- main ring (with gap = "open" web) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="880 176" transform="rotate(-60 256 256)" filter="url(#glow)"/>

  <!-- core -->
  <circle cx="256" cy="256" r="104" fill="url(#core)" stroke="url(#ring)" stroke-width="5"/>

  <!-- terminal prompt >_ -->
  <g fill="none" stroke="url(#term)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="212,212 258,256 212,300"/>
    <line x1="280" y1="302" x2="326" y2="302"/>
  </g>

  <!-- accent nodes -->
  <g fill="#22ff88" filter="url(#glow)">
    <circle cx="256" cy="72" r="9"/>
    <circle cx="440" cy="256" r="7" fill="#22d3ee"/>
    <circle cx="72" cy="256" r="7" fill="#22d3ee"/>
  </g>
</svg>
